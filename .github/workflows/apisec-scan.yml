name: APIsec (disabled - configuration required)

# APIsec is intentionally not triggered by pushes, pull requests, or schedules.
# Re-enable it only after configuring a real APIsec project, credentials, and a
# reachable OpenCart test environment. The previous starter workflow targeted
# the demo project "VAmPI" and generated false CI failures.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configuration-required:
    name: APIsec configuration required
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled integration
        run: |
          echo "::notice title=APIsec disabled::Configure an OpenCart test project, APIsec credentials, and a reachable test endpoint before enabling this integration."