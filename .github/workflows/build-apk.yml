name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      custom_tag:
        description: 'Tag della Release (es. v1.1.1)'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build & Auto Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Secrets and Keystore
        run: |
          # Create placeholder .env for secrets gradle plugin
          touch .env
          echo "DUMMY_KEY=default" > .env
          
          # Generate local debug.keystore if missing
          mkdir -p ~/.android
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Extract App Version
        id: get_version
        run: |
          # Extract versionName from app/build.gradle.kts
          VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.1.1"
          fi
          
          # If custom_tag input is provided, use it
          if [ -n "${{ github.event.inputs.custom_tag }}" ]; then
            RELEASE_TAG="${{ github.event.inputs.custom_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RELEASE_TAG="${{ github.ref_name }}"
          else
            RELEASE_TAG="v${VERSION_NAME}"
          fi
          
          echo "version=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "Extracted Version: ${VERSION_NAME} with Tag: ${RELEASE_TAG}"

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true -Dorg.gradle.jvmargs=\"-Xmx4g -Dfile.encoding=UTF-8 -Djava.awt.headless=true\""
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Prepare Release Assets (APK & OpenCart Plugin)
        run: |
          mkdir -p release-assets
          VERSION="${{ steps.get_version.outputs.version }}"
          
          # 1. Package APK
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" "release-assets/CartAdmin-v${VERSION}.apk"
            echo "Copied $APK_FILE to release-assets/CartAdmin-v${VERSION}.apk"
          else
            echo "Error: No APK file generated!"
            exit 1
          fi

          # 2. Package OpenCart Bridge OCMOD Extension Zip
          if [ -d "opencart-plugin" ]; then
            cd opencart-plugin
            zip -r "../release-assets/cartadmin-opencart-bridge-v${VERSION}.ocmod.zip" install.xml upload/ README.md
            cd ..
            echo "Created release-assets/cartadmin-opencart-bridge-v${VERSION}.ocmod.zip"
          else
            echo "Warning: opencart-plugin folder not found, skipping plugin zip"
          fi

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CartAdmin-Release-Assets
          path: release-assets/*
          if-no-files-found: error

      - name: Auto Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.get_version.outputs.tag }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          APK_PATH="release-assets/CartAdmin-v${VERSION}.apk"
          PLUGIN_PATH="release-assets/cartadmin-opencart-bridge-v${VERSION}.ocmod.zip"
          RELEASE_TITLE="CartAdmin ${TAG_NAME} — OpenCart ITALIA by SOLO SOLUZIONI"
          
          cat << 'EOF' > release_notes.md
          ## 🛒 CartAdmin ${TAG_NAME} — App Ufficiale & Plugin OpenCart ITALIA

          **CartAdmin** è la piattaforma mobile e bridge ufficiale di **OpenCart ITALIA** ([www.opencartitalia.it](https://www.opencartitalia.it)) sviluppata da **SOLO SOLUZIONI** ([www.solosoluzioni.it](https://www.solosoluzioni.it)).

          ---

          ### 📦 Download Disponibili in questa Release

          | Download | Descrizione | Come Installare |
          | :--- | :--- | :--- |
          | 📱 **[`CartAdmin-v${VERSION}.apk`](../../releases/download/${TAG_NAME}/CartAdmin-v${VERSION}.apk)** | Applicazione Android per smartphone e tablet | Scarica e apri sul dispositivo Android |
          | 🔌 **[`cartadmin-opencart-bridge-v${VERSION}.ocmod.zip`](../../releases/download/${TAG_NAME}/cartadmin-opencart-bridge-v${VERSION}.ocmod.zip)** | Estensione / Plugin per OpenCart 2.x, 3.x e 4.x | Carica in *Estensioni > Programma di Installazione* |

          ---

          ### ✨ Note di Versione (${TAG_NAME})
          - 🔌 **Doppio Rilascio Automatico**: Download separato per App Android (`.apk`) e Plugin OpenCart (`.ocmod.zip`).
          - 🔒 **Security Hardening & CodeQL**: risolti tutti gli alert di sicurezza con NetworkSecurityConfig, cifratura credenziali e conformità CodeQL.
          - 🛡️ **Sicurezza Bancaria & TEE Hardware**: timeout inattività a 5 minuti, supporto sblocco biometrico immediato e cifratura hardware `AndroidKeyStore` AES-256 GCM.
          - 🔍 **Audit Log Server-Side & Locale**: sincronizzazione remota delle operazioni sul database OpenCart (`cartadmin_audit`) e tracciamento dispositivo.
          - 🏪 **Gestione Multi-Store con Conferma**: aggiunta e rimozione negozi sicura con dialogo di conferma prima dell'eliminazione.
          - 🎨 **Interfaccia High-Contrast (WCAG AAA)**: leggibilità ottimizzata con testi scuri definiti su sfondi chiari.
          - 🌐 **Branding Ufficiale OpenCart ITALIA by SOLO SOLUZIONI**: collegamenti ufficiali a [www.opencartitalia.it](https://www.opencartitalia.it) e [www.solosoluzioni.it](https://www.solosoluzioni.it).
          EOF

          # Replace placeholders in notes
          sed -i "s/\${TAG_NAME}/${TAG_NAME}/g" release_notes.md
          sed -i "s/\${VERSION}/${VERSION}/g" release_notes.md

          echo "Publishing release ${TAG_NAME} with APK and Plugin via GitHub CLI..."

          # Build list of asset arguments
          ASSET_ARGS=()
          if [ -f "$APK_PATH" ]; then
            ASSET_ARGS+=("$APK_PATH")
          fi
          if [ -f "$PLUGIN_PATH" ]; then
            ASSET_ARGS+=("$PLUGIN_PATH")
          fi

          # Check if release already exists
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} already exists. Uploading assets with clobber..."
            for asset in "${ASSET_ARGS[@]}"; do
              gh release upload "${TAG_NAME}" "$asset" --clobber || echo "Asset $asset uploaded or immutable."
            done
          else
            echo "Creating new release ${TAG_NAME} with assets..."
            gh release create "${TAG_NAME}" "${ASSET_ARGS[@]}" \
              --title "${RELEASE_TITLE}" \
              --notes-file release_notes.md \
              --latest
          fi
          echo "GitHub Release completed successfully with dual downloads (App APK + OpenCart Plugin)."
