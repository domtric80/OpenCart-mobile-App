name: Build Android APK & OpenCart Plugin

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      custom_tag:
        description: 'Tag della release da pubblicare (es. v1.2.4). Lasciare vuoto per build CI senza pubblicazione release.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build APK & OCMOD package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag: ${{ steps.get_version.outputs.tag }}
      is_release: ${{ steps.get_version.outputs.is_release }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '9.3.1'

      - name: Extract and validate release version
        id: get_version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::Could not extract versionName from app/build.gradle.kts"
            exit 1
          fi

          CUSTOM_TAG="${{ inputs.custom_tag }}"
          RELEASE_TAG=""
          IS_RELEASE="false"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
            IS_RELEASE="true"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "$CUSTOM_TAG" ]]; then
            RELEASE_TAG="$CUSTOM_TAG"
            IS_RELEASE="true"
          else
            RELEASE_TAG="v${VERSION_NAME}"
            IS_RELEASE="false"
          fi

          if [ "$IS_RELEASE" = "true" ]; then
            if [ "$RELEASE_TAG" != "v${VERSION_NAME}" ]; then
              echo "::error::Tag '${RELEASE_TAG}' does not match versionName 'v${VERSION_NAME}' in app/build.gradle.kts"
              exit 1
            fi
            if [ "$RELEASE_TAG" = "v1.2.3" ]; then
              echo "::error::Release v1.2.3 is immutable and cannot be re-published."
              exit 1
            fi
          fi

          {
            echo "version=${VERSION_NAME}"
            echo "tag=${RELEASE_TAG}"
            echo "is_release=${IS_RELEASE}"
          } >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION_NAME}; Release Tag: ${RELEASE_TAG}; Is Release: ${IS_RELEASE}"

      - name: Prepare Build Environment
        run: |
          touch .env
          echo "DUMMY_KEY=default" > .env
          test -f ./gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          chmod +x ./gradlew
          mkdir -p ~/.android
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          fi

      - name: Build Debug APK (CI)
        if: steps.get_version.outputs.is_release != 'true'
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true -Dorg.gradle.jvmargs=\"-Xmx4g -Dfile.encoding=UTF-8 -Djava.awt.headless=true\""
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Run Android Verification Gates
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true -Dorg.gradle.jvmargs=\"-Xmx4g -Dfile.encoding=UTF-8 -Djava.awt.headless=true\""
        run: |
          ./gradlew \
            :app:testDebugUnitTest \
            :app:compileDebugAndroidTestKotlin \
            :app:lintDebug \
            --no-daemon \
            --stacktrace

      - name: Build and Sign Release APK
        if: steps.get_version.outputs.is_release == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          GRADLE_OPTS: "-Djava.awt.headless=true -Dorg.gradle.jvmargs=\"-Xmx4g -Dfile.encoding=UTF-8 -Djava.awt.headless=true\""
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_KEYSTORE_BASE64:-}" ] || [ -z "${RELEASE_KEYSTORE_PASSWORD:-}" ] || [ -z "${RELEASE_KEY_ALIAS:-}" ] || [ -z "${RELEASE_KEY_PASSWORD:-}" ]; then
            echo "::error::Release keystore secrets (RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD) are required for publishing a release."
            exit 1
          fi

          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/release-upload.jks"
          export KEYSTORE_PATH="${RUNNER_TEMP}/release-upload.jks"
          export STORE_PASSWORD="$RELEASE_KEYSTORE_PASSWORD"
          export KEY_ALIAS="$RELEASE_KEY_ALIAS"
          export KEY_PASSWORD="$RELEASE_KEY_PASSWORD"

          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare Artifacts (APK & OpenCart Plugin)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          VERSION="${{ steps.get_version.outputs.version }}"
          IS_RELEASE="${{ steps.get_version.outputs.is_release }}"

          if [ "$IS_RELEASE" = "true" ]; then
            APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          else
            APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "::error::No APK file generated."
            exit 1
          fi
          cp "$APK_FILE" "release-assets/CartAdmin-v${VERSION}.apk"

          if [ ! -d "opencart-plugin" ]; then
            echo "::error::opencart-plugin directory not found."
            exit 1
          fi

          (
            cd opencart-plugin
            zip -q -r "../release-assets/cartadmin.ocmod.zip" install.json admin/ README.md
            cd upload
            zip -q -j "../../release-assets/cartadmin.ocmod.zip" cartadmin_api.php cartadmin_auth.php
          )

          unzip -t "release-assets/cartadmin.ocmod.zip"
          entries="$(unzip -Z1 "release-assets/cartadmin.ocmod.zip")"
          grep -Fxq 'install.json' <<<"$entries"
          grep -Fxq 'cartadmin_api.php' <<<"$entries"
          grep -Fxq 'cartadmin_auth.php' <<<"$entries"
          grep -Fxq 'admin/controller/module/cartadmin.php' <<<"$entries"
          grep -Fxq 'admin/model/module/cartadmin.php' <<<"$entries"

          (
            cd release-assets
            sha256sum "CartAdmin-v${VERSION}.apk" cartadmin.ocmod.zip > SHA256SUMS.txt
          )

      - name: Attest release artifacts
        if: steps.get_version.outputs.is_release == 'true'
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            release-assets/CartAdmin-v${{ steps.get_version.outputs.version }}.apk
            release-assets/cartadmin.ocmod.zip

      - name: Upload Build Artifacts (CI)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: CartAdmin-Build-Assets
          path: release-assets/*
          if-no-files-found: error

  publish-release:
    name: Publish Official Release
    needs: build
    if: needs.build.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: CartAdmin-Build-Assets
          path: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="release-assets/CartAdmin-v${VERSION}.apk"
          PLUGIN_PATH="release-assets/cartadmin.ocmod.zip"
          CHECKSUM_PATH="release-assets/SHA256SUMS.txt"
          RELEASE_TITLE="CartAdmin ${TAG_NAME} — OpenCart ITALIA by SOLO SOLUZIONI"
          RELEASE_FLAGS=(--latest)

          if [[ "$VERSION" == *-* ]]; then
            RELEASE_FLAGS=(--prerelease)
            RELEASE_TITLE="CartAdmin ${TAG_NAME} — Pre-release di test"
          fi

          if gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::Release ${TAG_NAME} already exists and cannot be overwritten."
            exit 1
          fi

          if [[ "$VERSION" == *-* ]]; then
            cat << EOF > release_notes.md
          ## CartAdmin ${TAG_NAME} — pre-release di test

          > **Non usare in produzione.** Questa build 2.1 serve a verificare su dispositivi Android fisici i flussi amministrativi, la protezione hardware delle credenziali e la compatibilità dei provider multimediali OEM.

          ### Correzioni di ${TAG_NAME}

          - corretto il crash immediatamente successivo allo sblocco biometrico: il ViewModel della sessione protetta viene ora creato con la factory Android e riceve correttamente il contesto applicativo;
          - mantenuta la distruzione del ViewModel e dei dati sensibili a ogni blocco o passaggio dell'app in background;
          - aggiunto un controllo di regressione specifico per impedire il ritorno della creazione senza factory;
          - barra di formattazione spostata stabilmente in alto, sotto il titolo dell'editor, per restare accessibile con qualsiasi tastiera Android;
          - corretta l'applicazione effettiva di grassetto, corsivo, sottolineato, colore e stili quando il cursore segue le righe finali generate dalla conversione HTML;
          - aggiunto un test strumentale che apre la tastiera, aziona Grassetto e verifica il markup HTML prodotto;
          - ripristinato il caricamento delle categorie reali nella schermata Nuovo prodotto, con aggiornamento mirato quando la pagina viene aperta e selezione sicura dopo risposte asincrone;
          - editor visuale ridisegnato a schermo intero con area di scrittura estesa, comandi rappresentati da icone e barra fissa sopra tastiera e barre di sistema;
          - aggiunti test strumentali per caricamento tardivo delle categorie e permanenza della toolbar prima e dopo l'apertura della tastiera;
          - "Nuovo prodotto" e "Nuovo articolo" ora usano schermate dedicate a pagina intera, più leggibili e adatte alla compilazione da smartphone;
          - descrizioni prodotto e contenuti articolo dispongono di un editor visuale con P/H1/H2/H3, colore testo, grassetto, corsivo, sottolineato ed elenco puntato;
          - la barra dell'editor si adatta all'apertura della tastiera e il markup viene sanificato sia sul dispositivo sia dal bridge OpenCart prima del salvataggio;
          - flusso multimediale ridotto ai contratti di sistema \`TakePicturePreview\` e \`GetContent\`, eliminando FileProvider, URI condivisi, Photo Picker e grant OEM;
          - fotocamera e galleria senza permessi generali; in caso di errore viene mostrato anche il dettaglio tecnico restituito dal dispositivo;
          - AndroidX Fragment aggiornato e allineato ad Activity per eliminare l'errore \`Can only use lower 16 bits for requestCode\`;
          - conteggio dei guest e dei clienti registrati dalle sessioni che OpenCart mantiene nella tabella nativa \`customer_online\`, senza un secondo filtro soggetto a differenze tra orologio PHP e MySQL;
          - diagnostica nell'app con numero di record, ultima visita e indicazioni quando OpenCart non sta popolando \`customer_online\`.

          ### Funzioni 2.1 incluse

          - creazione e modifica di prodotti e categorie, incluse immagini JPEG/PNG/WebP validate fino a 5 MB;
          - creazione di articoli e categorie CMS, inclusi meta tag e immagine editoriale;
          - gestione controllata di pagine, recensioni, articoli e argomenti;
          - token distinti per operatore e dispositivo, scope minimi, revoca selettiva e audit server-side atomico.

          ### Sicurezza confermata

          - autenticazione del bridge OpenCart esclusivamente tramite header; rimosso il provisioning pubblico e l'invio di credenziali in URL o form;
          - credenziali Android cifrate con AES-256-GCM e chiave hardware-backed di Android Keystore;
          - StrongBox preferito quando disponibile e TEE hardware-backed obbligatorio; il salvataggio persistente fallisce in modo sicuro sui dispositivi privi di protezione hardware;
          - migrazione dei dati Room precedentemente in chiaro e bonifica del database SQLite;
          - migrazione delle password locali a PBKDF2;
          - regole di backup Android aggiornate per escludere dati sensibili;
          - pacchetto installabile da OpenCart 4.1.x con \`install.json\` e configurazione dal pannello amministrativo;
          - token bridge mostrato una sola volta e memorizzato nel database esclusivamente come hash non reversibile Argon2id/bcrypt;
          - rimosso dall'app il generatore PHP che incorporava il token in un file.

          ### Artefatti

          - [CartAdmin-v${VERSION}.apk](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/CartAdmin-v${VERSION}.apk) — APK release firmato dal workflow GitHub Actions;
          - [cartadmin.ocmod.zip](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/cartadmin.ocmod.zip) — estensione per OpenCart 4.1.x.

          ### Verifiche eseguite

          - build release firmata, test unitari, compilazione dei test strumentali e Android Lint;
          - sintassi e test PHP, struttura OCMOD, CodeQL, Dependency Review e Semgrep;
          - test strumentali eseguiti localmente su AVD Pixel 8 API 36 prima della PR.

          App e bridge devono essere aggiornati insieme alla stessa versione. Rimane obbligatoria la prova su dispositivo fisico, in particolare sui provider fotocamera/galleria OEM e sullo store OpenCart di test. L'aggiornamento diretto funziona solo se l'app già installata è firmata con la stessa chiave di rilascio.
          EOF
          else
            cat << EOF > release_notes.md
          ## CartAdmin ${TAG_NAME}

          Release stabile di manutenzione. Mantiene aperta la scheda prodotto al ritorno dalla fotocamera e include la guida aggiornata di installazione e configurazione, preservando le difese fail-closed introdotte nella serie 2.1.

          ### Hardening confermato

          - il passaggio temporaneo alla fotocamera non distrugge più la sessione e la navigazione: al ritorno rimangono aperti la scheda prodotto e i dati già inseriti;
          - l'eccezione è limitata a un solo evento di background e scade entro cinque minuti; completamento, annullamento o errore della fotocamera la chiudono sempre;
          - il normale blocco biometrico continua ad applicarsi a ogni altro passaggio in background e il flusso galleria rimane invariato;
          - il comando **Copia token** verifica l'esito della Clipboard API, usa un fallback compatibile e comunica chiaramente successo o errore;
          - il token completo continua a essere mostrato una sola volta e non viene scritto nei log o persistito in chiaro dal modulo;
          - corretto il crash dovuto alla creazione del ViewModel protetto senza `AndroidViewModelFactory` dopo l'autenticazione;
          - sessione biometrica verificata su Redmi Note 9S con Android 12/API 31: processo attivo, Activity in stato `RESUMED` e nessuna eccezione applicativa in Logcat;
          - profilo negozio interamente cifrato tramite AES-256-GCM con chiave non esportabile TEE/StrongBox e autenticazione utente recente;
          - sblocco biometrico vincolato a \`BiometricPrompt.CryptoObject\`: una challenge casuale deve essere firmata e verificata prima di creare la sessione;
          - chiave ECDSA di sblocco non esportabile, autorizzata soltanto dalla biometria forte e obbligatoriamente custodita in TEE/StrongBox;
          - nessuna persistenza offline di ordini, clienti, resi, abbonamenti, audit, catalogo, telemetria o token FCM;
          - sessione distrutta quando l'app passa in background e comunque dopo cinque minuti; screenshot, overlay e tocchi oscurati bloccati;
          - ogni richiesta firmata con chiave ECDSA hardware, timestamp e nonce anti-replay; token associato al singolo dispositivo;
          - HTTPS/HSTS obbligatori, rate limiting, metodi HTTP fail-closed e scope granulari distinti per funzione;
          - identità dell'operatore determinata lato server e audit inserito atomicamente nella stessa transazione delle modifiche;
          - token legacy revocati durante la migrazione: dopo l'aggiornamento è obbligatorio generare un nuovo token per ogni dispositivo;
          - azioni GitHub fissate a commit immutabili, dipendenze Gradle verificate con SHA-256, checksum e attestazione di provenienza degli artefatti.

          ### Funzioni incluse dalla serie 2.1

          - CRUD remoto verificato per prodotti e categorie, con immagini da fotocamera o galleria validate fino a 5 MB;
          - creazione di articoli e categorie CMS con meta tag, immagine, lingue attive e associazione allo store;
          - modifica controllata di pagine, recensioni, articoli e argomenti, incluso il ricalcolo della valutazione prodotto;
          - editor HTML a pagina intera con toolbar fissa e comandi P/H1/H2/H3, colore, grassetto, corsivo, sottolineato ed elenco puntato;
          - approvazioni clienti e richieste GDPR tramite coda protetta e conferma nel pannello OpenCart;
          - telemetria distinta tra guest e clienti registrati dalla tabella nativa \`customer_online\`, senza identità personali nell'app;
          - dati amministrativi letti dalle tabelle native OpenCart, senza record dimostrativi;
          - app Android e bridge riportano entrambi la versione ${VERSION} e devono essere aggiornati insieme;
          - compatibilità confermata con Android API 24–36 e OpenCart 4.1.x.

          ### Artefatti

          - [CartAdmin-v${VERSION}.apk](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/CartAdmin-v${VERSION}.apk) — APK release firmato dal workflow GitHub Actions;
          - [cartadmin.ocmod.zip](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/cartadmin.ocmod.zip) — estensione per OpenCart 4.1.x.
          - [SHA256SUMS.txt](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/SHA256SUMS.txt) — checksum verificabili dei due artefatti.

          ### Verifiche automatiche

          Build release firmata, test unitari, compilazione dei test strumentali, Android Lint e struttura del pacchetto OCMOD sono verificati dal workflow di pubblicazione. I workflow di sicurezza eseguono inoltre CodeQL, Semgrep, controllo sintattico PHP e test dell'autenticazione del bridge.

          **Aggiornamento dalla 2.1.4:** installare prima il modulo OpenCart 2.1.5 e poi aggiornare l'app. I token per dispositivo esistenti restano validi e non devono essere ruotati nuovamente.

          Compatibilità confermata: Android API 24–36 e OpenCart 4.1.x. Il bridge non dichiara compatibilità con OpenCart 3.x.
          EOF
          fi

          echo "Creating new release ${TAG_NAME}..."
          gh release create "${TAG_NAME}" \
            "$APK_PATH" \
            "$PLUGIN_PATH" \
            "$CHECKSUM_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file release_notes.md \
            "${RELEASE_FLAGS[@]}"

          echo "Release ${TAG_NAME} created successfully with signed APK and OCMOD plugin."
