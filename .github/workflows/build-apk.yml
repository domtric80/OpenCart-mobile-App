name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build & Auto Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare Secrets and Keystore
        run: |
          # Create placeholder .env for secrets gradle plugin
          touch .env
          echo "DUMMY_KEY=default" > .env
          
          # Generate local debug.keystore if missing
          mkdir -p ~/.android
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Extract App Version
        id: get_version
        run: |
          # Extract versionName from app/build.gradle.kts
          VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.0.1"
          fi
          
          # If triggered by a git tag, use the tag, otherwise use v<VERSION_NAME>
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RELEASE_TAG="${{ github.ref_name }}"
          else
            RELEASE_TAG="v${VERSION_NAME}"
          fi
          
          echo "version=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "Extracted Version: ${VERSION_NAME} with Tag: ${RELEASE_TAG}"

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true -Dorg.gradle.jvmargs=\"-Xmx4g -Dfile.encoding=UTF-8 -Djava.awt.headless=true\""
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare Named APK
        run: |
          mkdir -p release-assets
          VERSION="${{ steps.get_version.outputs.version }}"
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/CartAdmin-v${VERSION}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CartAdmin-APK
          path: release-assets/*.apk
          if-no-files-found: error

      - name: Auto Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: "CartAdmin ${{ steps.get_version.outputs.tag }} — OpenCart ITALIA by SOLO SOLUZIONI"
          body: |
            ## 🛒 CartAdmin ${{ steps.get_version.outputs.tag }} — App Ufficiale OpenCart ITALIA
            
            **CartAdmin** è l'applicazione Android ufficiale di **OpenCart ITALIA** ([www.opencartitalia.it](https://www.opencartitalia.it)) sviluppata da **SOLO SOLUZIONI** ([www.solosoluzioni.it](https://www.solosoluzioni.it)).
            
            ### 📱 Download & Installazione
            1. Scarica il file **`CartAdmin-${{ steps.get_version.outputs.tag }}.apk`** allegato qui sotto.
            2. Aprilo sul tuo dispositivo Android e tocca **Installa**.
            
            ### ✨ Note di Versione (${{ steps.get_version.outputs.tag }})
            - Branding ufficiale OpenCart ITALIA by SOLO SOLUZIONI integrato nell'interfaccia
            - Collegamenti diretti al portale ufficiale e all'assistenza SOLO SOLUZIONI
            - Gestione ordini, catalogo, statistiche vendite e notifiche push in tempo reale
            - Cache locale offline per una navigazione ultra-fluida
          draft: false
          prerelease: false
          files: release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
