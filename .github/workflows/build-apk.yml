name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      custom_tag:
        description: 'Tag della Release (es. v1.1.1)'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build & Auto Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Secrets and Keystore
        run: |
          # Create placeholder .env for secrets gradle plugin
          touch .env
          echo "DUMMY_KEY=default" > .env
          
          # Generate local debug.keystore if missing
          mkdir -p ~/.android
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Extract App Version
        id: get_version
        run: |
          # Extract versionName from app/build.gradle.kts
          VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.1.1"
          fi
          
          # If custom_tag input is provided, use it
          if [ -n "${{ github.event.inputs.custom_tag }}" ]; then
            RELEASE_TAG="${{ github.event.inputs.custom_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RELEASE_TAG="${{ github.ref_name }}"
          else
            RELEASE_TAG="v${VERSION_NAME}"
          fi
          
          echo "version=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "Extracted Version: ${VERSION_NAME} with Tag: ${RELEASE_TAG}"

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true -Dorg.gradle.jvmargs=\"-Xmx4g -Dfile.encoding=UTF-8 -Djava.awt.headless=true\""
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Prepare Named APK
        run: |
          mkdir -p release-assets
          VERSION="${{ steps.get_version.outputs.version }}"
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" "release-assets/CartAdmin-v${VERSION}.apk"
            echo "Copied $APK_FILE to release-assets/CartAdmin-v${VERSION}.apk"
          else
            echo "Error: No APK file generated!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CartAdmin-APK
          path: release-assets/*.apk
          if-no-files-found: error

      - name: Auto Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: "CartAdmin ${{ steps.get_version.outputs.tag }} — OpenCart ITALIA by SOLO SOLUZIONI"
          body: |
            ## 🛒 CartAdmin ${{ steps.get_version.outputs.tag }} — App Ufficiale OpenCart ITALIA
            
            **CartAdmin** è l'applicazione Android ufficiale di **OpenCart ITALIA** ([www.opencartitalia.it](https://www.opencartitalia.it)) sviluppata da **SOLO SOLUZIONI** ([www.solosoluzioni.it](https://www.solosoluzioni.it)).
            
            ### 📱 Download & Installazione
            1. Scarica il file **`CartAdmin-v${{ steps.get_version.outputs.version }}.apk`** allegato qui sotto.
            2. Aprilo sul tuo dispositivo Android e tocca **Installa**.
            
            ### ✨ Note di Versione (${{ steps.get_version.outputs.tag }})
            - 🔒 **Security Hardening & CodeQL**: risolti tutti gli alert di sicurezza con NetworkSecurityConfig, cifratura credenziali e conformità CodeQL.
            - 🔍 **Audit Log Server-Side & Locale**: sincronizzazione remota delle operazioni sul database OpenCart (`cartadmin_audit`) e tracciamento dispositivo.
            - 🏪 **Gestione Multi-Store con Conferma**: aggiunta e rimozione negozi sicura con dialogo di conferma prima dell'eliminazione.
            - 🎨 **Interfaccia High-Contrast (WCAG AAA)**: leggibilità ottimizzata con testi scuri definiti su sfondi chiari.
            - 🛡️ **Sicurezza Operatore**: autenticazione biometrica, policy password forte (8+ caratteri con maiuscola, simbolo e numero) e hash salt+SHA256.
            - 🌐 **Branding Ufficiale OpenCart ITALIA by SOLO SOLUZIONI**: collegamenti ufficiali a [www.opencartitalia.it](https://www.opencartitalia.it) e [www.solosoluzioni.it](https://www.solosoluzioni.it).
          draft: false
          prerelease: false
          files: release-assets/*.apk
          make_latest: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
