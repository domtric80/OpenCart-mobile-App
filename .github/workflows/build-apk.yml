name: Build Android APK & OpenCart Plugin

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      custom_tag:
        description: 'Nuovo tag della release (deve coincidere con versionName, es. v1.2.2)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build APK & OCMOD package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Secrets and Keystore
        run: |
          touch .env
          echo "DUMMY_KEY=default" > .env

          mkdir -p ~/.android
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Extract and validate release version
        id: get_version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::Unable to read versionName from app/build.gradle.kts."
            exit 1
          fi

          CUSTOM_TAG="${{ inputs.custom_tag }}"
          RELEASE_TAG=""

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "$CUSTOM_TAG" ]]; then
            RELEASE_TAG="$CUSTOM_TAG"
          fi

          if [ -n "$RELEASE_TAG" ] && [ "$RELEASE_TAG" != "v${VERSION_NAME}" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match app version v${VERSION_NAME}."
            exit 1
          fi

          echo "version=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION_NAME}; release tag: ${RELEASE_TAG:-none}"

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true -Dorg.gradle.jvmargs=\"-Xmx4g -Dfile.encoding=UTF-8 -Djava.awt.headless=true\""
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Prepare Release Assets (APK & OpenCart Plugin)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          VERSION="${{ steps.get_version.outputs.version }}"

          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "::error::No APK file generated."
            exit 1
          fi
          cp "$APK_FILE" "release-assets/CartAdmin-v${VERSION}.apk"

          if [ ! -d "opencart-plugin" ]; then
            echo "::error::opencart-plugin directory not found."
            exit 1
          fi

          (
            cd opencart-plugin
            zip -q -r "../release-assets/cartadmin-opencart-bridge-v${VERSION}.ocmod.zip" install.xml upload/ README.md
          )

          unzip -t "release-assets/cartadmin-opencart-bridge-v${VERSION}.ocmod.zip"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CartAdmin-Release-Assets
          path: release-assets/*
          if-no-files-found: error

      - name: Publish a new GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.custom_tag != '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.get_version.outputs.tag }}
          VERSION: ${{ steps.get_version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="release-assets/CartAdmin-v${VERSION}.apk"
          PLUGIN_PATH="release-assets/cartadmin-opencart-bridge-v${VERSION}.ocmod.zip"
          RELEASE_TITLE="CartAdmin ${TAG_NAME} — OpenCart ITALIA by SOLO SOLUZIONI"

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "::error::Release ${TAG_NAME} already exists and will not be modified. Increase versionName and publish a new tag."
            exit 1
          fi

          cat << 'EOF' > release_notes.md
          ## 🛒 CartAdmin ${TAG_NAME} — App Ufficiale & Plugin OpenCart ITALIA

          **CartAdmin** è la piattaforma mobile e bridge ufficiale di **OpenCart ITALIA** ([www.opencartitalia.it](https://www.opencartitalia.it)) sviluppata da **SOLO SOLUZIONI** ([www.solosoluzioni.it](https://www.solosoluzioni.it)).

          ### 📦 Download disponibili

          | Download | Descrizione | Come installare |
          | :--- | :--- | :--- |
          | 📱 **CartAdmin-v${VERSION}.apk** | Applicazione Android per smartphone e tablet | Scarica e apri sul dispositivo Android |
          | 🔌 **cartadmin-opencart-bridge-v${VERSION}.ocmod.zip** | Estensione OpenCart | Carica in *Estensioni > Programma di installazione* |
          EOF

          sed -i "s/\${TAG_NAME}/${TAG_NAME}/g" release_notes.md
          sed -i "s/\${VERSION}/${VERSION}/g" release_notes.md

          gh release create "${TAG_NAME}"             "$APK_PATH"             "$PLUGIN_PATH"             --target "$GITHUB_SHA"             --title "$RELEASE_TITLE"             --notes-file release_notes.md             --latest

          echo "Release ${TAG_NAME} created successfully with APK and OCMOD plugin."