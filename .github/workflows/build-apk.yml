name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build & Auto Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Secrets and Keystore
        run: |
          # Create placeholder .env for secrets gradle plugin
          touch .env
          echo "DUMMY_KEY=default" > .env
          
          # Generate local debug.keystore if missing
          mkdir -p ~/.android
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true -Dorg.gradle.jvmargs=\"-Xmx4g -Dfile.encoding=UTF-8 -Djava.awt.headless=true\""
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare Named APK
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/CartAdmin-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CartAdmin-APK
          path: release-assets/CartAdmin-v1.0.0.apk
          if-no-files-found: error

      - name: Auto Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "CartAdmin v1.0.0 — Official Android Release"
          body: |
            ## 🛒 CartAdmin v1.0.0
            
            Android application for OpenCart e-commerce management.
            
            ### 📱 Download & Installation
            1. Download the **`CartAdmin-v1.0.0.apk`** attached below.
            2. Open the file on your Android device and tap **Install**.
            
            ### ✨ Features
            - Real-time sales metrics & revenue analytics
            - Order management & status workflows
            - Product inventory & catalog control
            - Offline-first cache with Room Database
            - FCM Push Notifications support
          draft: false
          prerelease: false
          files: release-assets/CartAdmin-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
