name: Security & CodeQL Scanning

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '30 2 * * 1' # Every Monday at 02:30 UTC
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql-analysis:
    name: CodeQL Code Analysis (Java / Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: 'java-kotlin'
          queries: security-extended

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build for CodeQL Analysis
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true -Dorg.gradle.jvmargs=\"-Xmx4g -Dfile.encoding=UTF-8 -Djava.awt.headless=true\""
        run: |
          touch .env
          echo "DUMMY_KEY=default" > .env
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:compileDebugKotlin --no-daemon
          else
            gradle :app:compileDebugKotlin --no-daemon
          fi

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"

  plugin-security:
    name: OpenCart Plugin Security (PHP / OCMOD)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify expected plugin sources
        shell: bash
        run: |
          set -euo pipefail
          test -f opencart-plugin/install.xml
          test -f opencart-plugin/upload/cartadmin_api.php

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' php_files < <(find opencart-plugin -type f -name '*.php' -print0)
          if [ "${#php_files[@]}" -eq 0 ]; then
            echo "::error::No PHP files found in opencart-plugin."
            exit 1
          fi
          for php_file in "${php_files[@]}"; do
            php -l "$php_file"
          done

      - name: Validate OCMOD manifest XML
        shell: bash
        run: |
          set -euo pipefail
          python - opencart-plugin/install.xml <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          ET.parse(sys.argv[1])
          print(f"Valid XML: {sys.argv[1]}")
          PY

      - name: Set up Python for Semgrep
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check "semgrep==1.174.0"

      - name: Scan PHP plugin with Semgrep
        run: |
          semgrep scan             --config p/php             --config p/security-audit             --config p/secrets             --severity ERROR             --error             opencart-plugin

      - name: Build and validate OCMOD archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-assets
          (
            cd opencart-plugin
            zip -q -r ../validation-assets/cartadmin-opencart-bridge.ocmod.zip install.xml upload/ README.md
          )

          archive="validation-assets/cartadmin-opencart-bridge.ocmod.zip"
          entries="$(unzip -Z1 "$archive")"
          printf '%s\n' "$entries"

          grep -Fxq 'install.xml' <<<"$entries"
          grep -Fxq 'upload/cartadmin_api.php' <<<"$entries"

          if grep -Eq '(^/|(^|/)\.\.(/|$)|\\)' <<<"$entries"; then
            echo "::error::Unsafe path found in OCMOD archive."
            exit 1
          fi

          unzip -t "$archive"

  dependency-review:
    name: Dependency Review & Secrets Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4