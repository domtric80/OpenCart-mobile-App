name: Security & CodeQL Scanning

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '30 2 * * 1' # Every Monday at 02:30 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql-analysis:
    name: CodeQL Code Analysis (Java / Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: 'java-kotlin'
          queries: security-extended

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Build for CodeQL Analysis
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true -Dorg.gradle.jvmargs=\"-Xmx4g -Dfile.encoding=UTF-8 -Djava.awt.headless=true\""
        run: |
          touch .env
          echo "DUMMY_KEY=default" > .env
          mkdir -p ~/.android
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          fi
          test -f ./gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          chmod +x ./gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"

  plugin-security:
    name: OpenCart Plugin Security (PHP / OCMOD)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: php-cs-fixer

      - name: Verify expected plugin sources
        shell: bash
        run: |
          set -euo pipefail
          test -f opencart-plugin/install.json
          test -f opencart-plugin/upload/cartadmin_api.php
          test -f opencart-plugin/upload/cartadmin_auth.php
          test -f opencart-plugin/admin/controller/module/cartadmin.php
          test -f opencart-plugin/admin/model/module/cartadmin.php
          test -f opencart-plugin/tests/auth_test.php

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' php_files < <(find opencart-plugin -type f -name '*.php' -print0)
          if [ "${#php_files[@]}" -eq 0 ]; then
            echo "::error::No PHP files found in opencart-plugin."
            exit 1
          fi
          for php_file in "${php_files[@]}"; do
            php -l "$php_file"
          done

      - name: Run bridge authentication regression tests
        run: php opencart-plugin/tests/auth_test.php

      - name: Validate OpenCart 4 manifest JSON
        shell: bash
        run: |
          set -euo pipefail
          python3 - opencart-plugin/install.json <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as manifest_file:
              manifest = json.load(manifest_file)
          for field in ("name", "description", "version", "author", "link"):
              if not manifest.get(field):
                  raise SystemExit(f"Missing install.json field: {field}")
          print(f"Valid OpenCart 4 manifest: {sys.argv[1]}")
          PY

      - name: Set up Python for Semgrep
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: python3 -m pip install --disable-pip-version-check "semgrep==1.174.0"

      - name: Scan PHP plugin with Semgrep
        shell: bash
        run: |
          set -euo pipefail
          semgrep scan \
            --config p/php \
            --config p/security-audit \
            --config p/secrets \
            --severity ERROR \
            --error \
            opencart-plugin

      - name: Build and validate OCMOD archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-assets
          (
            cd opencart-plugin
            zip -q -r ../validation-assets/cartadmin.ocmod.zip install.json admin/ README.md
            cd upload
            zip -q -j ../../validation-assets/cartadmin.ocmod.zip cartadmin_api.php cartadmin_auth.php
          )

          archive="validation-assets/cartadmin.ocmod.zip"
          entries="$(unzip -Z1 "$archive")"
          printf '%s\n' "$entries"

          grep -Fxq 'install.json' <<<"$entries"
          grep -Fxq 'cartadmin_api.php' <<<"$entries"
          grep -Fxq 'cartadmin_auth.php' <<<"$entries"
          grep -Fxq 'admin/controller/module/cartadmin.php' <<<"$entries"
          grep -Fxq 'admin/model/module/cartadmin.php' <<<"$entries"

          if grep -Eq '(^/|(^|/)\.\.(/|$)|\\)' <<<"$entries"; then
            echo "::error::Unsafe path found in OCMOD archive."
            exit 1
          fi

          unzip -t "$archive"

  dependency-review:
    name: Dependency Review & Security Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
